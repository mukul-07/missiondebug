[project]
name = "missiondebug-agent"
version = "0.0.0"
description = "MissionDebug v0 ROS 2 agent: ring buffer, MCAP writer, anomaly detector, control API."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "mcap>=1.2.1",
  "mcap-ros2-support>=0.5.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]
# v2 P5a — optional S3 upload of MCAP files. boto3 works against AWS S3,
# MinIO, Cloudflare R2, and any S3-compatible store. Heavy (~30MB) but
# well-tested. Customers who want durability install:
#   pip install missiondebug-agent[s3]
# v1.5 single-robot deployments keep working without it.
s3 = [
  "boto3>=1.34",
]

[project.scripts]
missiondebug-agent = "missiondebug_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missiondebug_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
