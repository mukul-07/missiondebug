# Copy to inventory.ini and edit. Each hostname becomes that robot's
# robot_id in MissionDebug — keep them unique.

[robots]
warehouse-bot-01 ansible_host=192.168.1.101
warehouse-bot-02 ansible_host=192.168.1.102
warehouse-bot-03 ansible_host=192.168.1.103 md_subsystem=power

[robots:vars]
ansible_user=robot
md_hub_url=http://192.168.1.50:8000
# Override captured topics per group if your stack differs:
# md_topics='[{"name": "/tf", "type": "tf2_msgs/msg/TFMessage"}, {"name": "/cmd_vel", "type": "geometry_msgs/msg/Twist"}]'
