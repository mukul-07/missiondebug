[project]
name = "missiondebug-backend"
version = "0.0.0"
description = "MissionDebug v0 backend: session index, MCAP file server."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcap>=1.2.1",
  # v2: async HTTP client for hub-as-proxy MCAP fetch (Phase 1.5).
  # Already pulled in transitively by fastapi/starlette in many setups
  # but pinning it here makes the dependency explicit.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
  # Installed in dev so the OTel export path is exercised by tests.
  "opentelemetry-sdk>=1.42",
  "opentelemetry-exporter-otlp-proto-http>=1.42",
]
# Opt-in OpenTelemetry export (metrics + incident events to an OTLP
# collector). Not pulled by the base install — `pip install
# 'missiondebug-backend[otel]'` only when you want to wire the hub into
# Grafana / Datadog / your alert routing. See docs/INTEGRATIONS.md.
otel = [
  "opentelemetry-sdk>=1.42",
  "opentelemetry-exporter-otlp-proto-http>=1.42",
]

[project.scripts]
missiondebug-backend = "missiondebug_backend.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missiondebug_backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
