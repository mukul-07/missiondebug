name: Tests

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "backend/**"
      - "Makefile"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "agent/**"
      - "backend/**"
      - "Makefile"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            agent/uv.lock
            backend/uv.lock

      - name: Install agent + backend (venvs)
        run: |
          cd agent   && uv sync --extra dev
          cd ../backend && uv sync --extra dev
          # Backend tests reuse the agent's mcap_writer to seed sessions.
          # uv-created venvs don't include pip by default, so use `uv pip`.
          uv pip install -e ../agent

      - name: Install pytest-cov (coverage only on 3.11)
        if: matrix.python-version == '3.11'
        run: |
          cd agent   && uv pip install pytest-cov
          cd ../backend && uv pip install pytest-cov

      - name: Run tests
        if: matrix.python-version != '3.11'
        run: make test

      - name: Run tests with coverage (3.11 only)
        if: matrix.python-version == '3.11'
        run: |
          cd agent && env -u PYTHONPATH .venv/bin/pytest -q \
            --cov=missiondebug_agent --cov-report=xml:coverage.xml
          cd ../backend && env -u PYTHONPATH .venv/bin/pytest -q \
            --cov=missiondebug_backend --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./agent/coverage.xml,./backend/coverage.xml
          flags: agent,backend
          fail_ci_if_error: false
